name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Contract + community script lint
        run: make quality

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Validate parent POM
        run: mvn -N -B validate

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: afirma-core unit tests
        run: make test

  community:
    name: community
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Community invariants
        run: make test-community

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Package afirma-core
        run: make build

      - name: Upload afirma-core JAR
        uses: actions/upload-artifact@v4
        with:
          name: afirma-core
          path: afirma-core/target/*.jar
          if-no-files-found: error
          retention-days: 7

  crypto-validation:
    name: crypto-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run crypto validation tests
        run: |
          cd tests/validation-harness
          mvn -B test

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high
          allow-ghsas: ''
          fail-on-scopes: ''

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      # CycloneDX/maven-generate-sbom-action is unpublished; use the Maven plugin.
      # env=install now includes fork crypto modules (see pom.xml) so Central
      # SpongyCastle 1.9.1 artifacts are not mixed with BouncyCastle sources.
      - name: Build project and generate CycloneDX SBOM
        run: |
          mvn -B clean install -DskipTests -Denv=install \
            org.cyclonedx:cyclonedx-maven-plugin:2.7.6:makeAggregateBom \
            -DoutputFormat=json \
            -DoutputName=bom \
            -DschemaVersion=1.5
          test -f target/bom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest SBOM
        if: github.repository == 'Soluciones-Alexendros/clienteafirma-alexendros'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/bom.json

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inventory + community smoke
        run: make smoke
