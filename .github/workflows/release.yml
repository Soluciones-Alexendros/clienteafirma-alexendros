name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create GitHub Release (false = dry-run artifacts only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && format('dry-run-{0}', github.sha) || github.ref_name }}
      DO_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          cache-dependency-path: pom.xml

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Build all modules
        run: |
          export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" mvn -B clean install -DskipTests -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH"

      - name: Build env-install profile (JAR + services)
        run: |
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" mvn -B clean install -DskipTests -Denv=install -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" -pl '!afirma-server-triphase-signer,!afirma-signature-retriever,!afirma-signature-storage'

      - name: Run F2 regression vectors
        run: |
          bash scripts/f2-regression.sh

      - name: "SEC-2026-010: Verify reproducible JAR build"
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/reproducible-verify"
          mkdir -p "$WORK"
          REPO="$GITHUB_WORKSPACE"
          # Pin wall-clock independent timestamps for both clean builds (SEC-2026-010).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          MVN_REPRO=(-Dproject.build.outputTimestamp="${SOURCE_DATE_EPOCH}")

          git worktree add "$WORK/worktree1" HEAD
          (
            cd "$WORK/worktree1"
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" mvn -B clean install -DskipTests -Denv=install "${MVN_REPRO[@]}" -pl afirma-simple -am
            cp afirma-simple/target/autofirma.jar "$WORK/build1.jar"
            sha256sum "$WORK/build1.jar" > "$WORK/build1.sha256"
          )

          git worktree add "$WORK/worktree2" HEAD
          (
            cd "$WORK/worktree2"
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" mvn -B clean install -DskipTests -Denv=install "${MVN_REPRO[@]}" -pl afirma-simple -am
            cp afirma-simple/target/autofirma.jar "$WORK/build2.jar"
            sha256sum "$WORK/build2.jar" > "$WORK/build2.sha256"
          )

          sha256_1=$(cut -d' ' -f1 "$WORK/build1.sha256")
          sha256_2=$(cut -d' ' -f1 "$WORK/build2.sha256")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          echo "Build 1 SHA256: $sha256_1"
          echo "Build 2 SHA256: $sha256_2"
          mkdir -p "$REPO/verify-reproducible"
          if [ "$sha256_1" != "$sha256_2" ]; then
            echo "Reproducible build FAILED: Hashes differ — publishing first differing ZIP entry (ROADMAP SEC-2026-010)"
            python3 - "$WORK/build1.jar" "$WORK/build2.jar" "$REPO/verify-reproducible/first-zip-diff.txt" <<'PY'
          import sys, zipfile
          a, b, out = sys.argv[1], sys.argv[2], sys.argv[3]
          za, zb = zipfile.ZipFile(a), zipfile.ZipFile(b)
          na = {i.filename: i for i in za.infolist()}
          nb = {i.filename: i for i in zb.infolist()}
          lines = []
          for name in sorted(set(na) | set(nb)):
              ia, ib = na.get(name), nb.get(name)
              if ia is None or ib is None:
                  lines.append(f"missing entry: {name} only_in={'a' if ib is None else 'b'}")
                  break
              da, db = za.read(name), zb.read(name)
              if da != db or ia.date_time != ib.date_time or ia.compress_type != ib.compress_type:
                  lines.append(f"first-diff: {name}")
                  lines.append(f"  date_time_a={ia.date_time} date_time_b={ib.date_time}")
                  lines.append(f"  compress_a={ia.compress_type} compress_b={ib.compress_type}")
                  lines.append(f"  size_a={len(da)} size_b={len(db)} content_equal={da == db}")
                  break
          else:
              lines.append("no per-entry content/time diffs found (outer hashes still differ)")
          open(out, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
            echo "SHA256_1: $sha256_1" > "$REPO/verify-reproducible/reproducible-build.sha256"
            echo "SHA256_2: $sha256_2" >> "$REPO/verify-reproducible/reproducible-build.sha256"
            echo "STATUS: DIFFER (see first-zip-diff.txt)" >> "$REPO/verify-reproducible/reproducible-build.sha256"
            exit 1
          fi
          echo "Reproducible build verified"
          echo "SHA256: $sha256_1" > "$REPO/verify-reproducible/reproducible-build.sha256"

          git worktree remove "$WORK/worktree1" --force
          git worktree remove "$WORK/worktree2" --force

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --import --batch --yes
            gpg --list-secret-keys --keyid-format LONG
          else
            echo "GPG_PRIVATE_KEY not set, skipping GPG import"
          fi

      - name: Install appimagetool and FUSE
        continue-on-error: true
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Package Linux artifacts (DEB, RPM, AppImage)
        continue-on-error: true
        run: |
          bash scripts/f6-package-linux.sh
          ARCH=x86_64 bash scripts/f6-appimage.sh

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          test -f afirma-simple/target/autofirma.jar
          cp afirma-simple/target/autofirma.jar "release-artifacts/autofirma-${RELEASE_NAME}.jar"
          find packaging -name 'autofirma-2026_*.deb' -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find packaging/stage-rpm -name '*.rpm' -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find . -maxdepth 1 -name '*.AppImage' -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find packaging/flatpak -name '*.flatpak' -exec cp {} release-artifacts/ \; 2>/dev/null || true
          cp verify-reproducible/reproducible-build.sha256 release-artifacts/reproducible-build.sha256

      - name: Generate SHA256SUMS
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS

      - name: Sign artifacts with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            cd release-artifacts
            find . -maxdepth 1 -type f \( -name '*.jar' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' -o -name '*.sha256' \) | while read -r f; do
              if [ -f "$f" ]; then
                gpg --armor --detach-sign --output "$f.asc" "$f"
              fi
            done
          else
            echo "GPG_PRIVATE_KEY not set, skipping artifact signing"
          fi

      - name: Sign SHA256SUMS with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            cd release-artifacts
            gpg --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          else
            echo "GPG_PRIVATE_KEY not set, skipping SHA256SUMS signing"
          fi

      - name: Generate SBOM with CycloneDX
        run: |
          set -euo pipefail
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.7.6:makeBom -pl afirma-simple
          test -f afirma-simple/target/bom.json
          cp afirma-simple/target/bom.json release-artifacts/bom.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Create Release Notes
        if: env.DO_PUBLISH == 'true'
        run: |
          printf '%s\n' "## Autofirma ${{ github.ref_name }}" "" "### Qué incluye" "- JAR autoejecutable (\`autofirma.jar\`)" "- Paquete DEB (Debian/Ubuntu)" "- Paquete RPM (Fedora/RHEL/openSUSE)" "- AppImage (universal Linux)" "- Flatpak (cuando esté disponible)" "- Checksums SHA256 para cada artefacto" "- SBOM (CycloneDX JSON)" "- Firmas GPG (\`.asc\`) y checksums SHA256" "" "### Verificación" "\`\`\`bash" "# Verificar firma GPG" "gpg --verify autofirma-${{ github.ref_name }}.jar.asc autofirma-${{ github.ref_name }}.jar" "" "# Verificar checksum" "sha256sum -c SHA256SUMS" "\`\`\`" "" "### Cambios" "Ver [CHANGELOG.md](CHANGELOG.md) para detalles." "" "### Licencia" "GPL-2.0+ / EUPL-1.1" > release-notes.md

      - name: Create GitHub Release
        if: env.DO_PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Autofirma ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOM
        if: env.DO_PUBLISH == 'true' && github.repository == 'Soluciones-Alexendros/clienteafirma-alexendros'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/bom.json

      - name: Dry-run summary
        if: env.DO_PUBLISH != 'true'
        run: |
          echo "Dry-run complete: artifacts uploaded as release-artifacts (no GitHub Release)."
          ls -la release-artifacts

  validate:
    name: Validate Release Artifacts
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 15
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .

      - name: Verify GPG signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            find . -maxdepth 1 -type f -name '*.asc' | while read -r f; do
              if [ -f "$f" ]; then
                gpg --verify "$f" "${f%.asc}" && echo "OK $f verified" || exit 1
              fi
            done
          else
            echo "GPG_PRIVATE_KEY not set, skipping GPG signature verification"
          fi

      - name: Verify SHA256SUMS
        run: |
          sha256sum -c SHA256SUMS

      - name: Verify SBOM and reproducible build
        run: |
          test -f bom.json
          test -f reproducible-build.sha256
          echo "SBOM and reproducible-build.sha256 present"

  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [release, validate]
    timeout-minutes: 5
    steps:
      - name: Notify completion
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            echo "Dry-run Release completed (no publish)"
          else
            echo "Release ${{ github.ref_name }} published successfully"
            echo "URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          fi
