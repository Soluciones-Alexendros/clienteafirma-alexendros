name: CodeQL + Semgrep

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main, plan/clienteafirma-alertas]
  pull_request:
    branches: [master, main, plan/clienteafirma-alertas]
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build with Maven (skip failing modules)
        run: mvn -B clean compile -DskipTests -Denv=install -pl '!afirma-simple,!afirma-ui-simple-configurator,!afirma-server-triphase-signer,!afirma-signature-retriever,!afirma-signature-storage' -am

      # Default CodeQL setup is enabled on this repo; advanced upload conflicts
      # ("analyses from advanced configurations cannot be processed when the
      # default setup is enabled"). Keep artifacts for Merge SARIF; Alejandro
      # can disable default setup in Settings → Code security to re-enable upload.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false

      - name: Upload CodeQL SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: |
            **/results/**/*.sarif
            **/codeql-*.sarif
            **/*codeql*.sarif
          if-no-files-found: warn
          retention-days: 7

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip3 install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config=auto --config=p/ci \
            --sarif --output=semgrep.sarif \
            --error --max-target-bytes=1000000 || true

      - name: Upload Semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 7

  # CodeQL SARIF stays as artifact only (default setup blocks advanced upload).
  # Semgrep uploads once above (category: semgrep). Do not re-upload Semgrep under
  # category "merged" — that duplicated every Semgrep alert in code scanning (#93).
  sarif-artifacts:
    name: Keep CodeQL SARIF artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [codeql, semgrep]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Download CodeQL SARIF
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codeql-results
          path: sarif/codeql

      - name: Confirm Semgrep was not re-uploaded
        run: |
          echo "Semgrep SARIF is uploaded only by job semgrep (category: semgrep)."
          ls -la sarif/codeql 2>/dev/null || echo "No CodeQL SARIF artifact (warn-only)."
