name: Accessibility

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    name: Accessibility (Code Verification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          pip3 install pytest

      - name: Run accessibility code verification tests
        continue-on-error: true
        run: |
          make test-accessibility

  # Experimental: Full Orca GUI tests (non-blocking)
  accessibility-orca:
    name: Accessibility (Orca GUI - Experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Install accessibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            orca \
            python3-dogtail \
            python3-pytest \
            python3-gi \
            gir1.2-atspi-2.0 \
            libatspi2.0-dev
          pip3 install pytest

      - name: Set up JDK 8 for build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build JAR (for accessibility testing)
        run: |
          # ArtifactId is afirma-ui-simpleafirma; path selector keeps -am deps correct.
          mvn -B clean install -DskipTests -Denv=install -pl :afirma-ui-simpleafirma -am

      - name: Run full Orca accessibility tests (experimental)
        continue-on-error: true
        run: |
          # Start Xvfb
          Xvfb :99 -screen 0 1024x768x24 -ac &
          export DISPLAY=:99
          sleep 2
          
          # Start Orca
          orca --replace &
          sleep 3
          
          # Run accessibility tests
          cd tests/accessibility
          python3 -m pytest src/test/python/orca_test_suite.py::TestAutofirmaAccessibility -v || true
          
        env:
          DISPLAY: ':99'
